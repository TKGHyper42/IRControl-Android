name: Build and Publish IR Control APK

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ir-control-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Gradle 9.6.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
      - name: Android API 37
        run: |
          SDKMANAGER="$(find /usr/local/lib/android/sdk/cmdline-tools -type f -name sdkmanager | head -n1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --channel=3 "platforms;android-37.0" "build-tools;36.0.0"
          if [ -d "$ANDROID_HOME/platforms/android-37.0" ] && [ ! -e "$ANDROID_HOME/platforms/android-37" ]; then
            ln -s android-37.0 "$ANDROID_HOME/platforms/android-37"
          fi
      - name: Identify application version
        id: version
        shell: bash
        run: |
          VERSION="$(awk -F"'" '/^[[:space:]]*versionName[[:space:]]+/ {print $2; exit}' app/build.gradle)"
          API="$(sed -nE 's/^[[:space:]]*compileSdk[[:space:]]+([0-9]+).*$/\1/p' app/build.gradle | head -n1)"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || [[ ! "$API" =~ ^[0-9]+$ ]]; then
            echo "::error::Could not identify versionName or compileSdk in app/build.gradle"
            exit 1
          fi
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "filename=IRControl-Android-v$VERSION-API$API.apk" >> "$GITHUB_OUTPUT"
          echo "Building IR Control Testing v$VERSION for API $API"
      - name: Build signed debug APK
        run: gradle --no-daemon --stacktrace :app:assembleDebug
      - name: Stage versioned APK
        env:
          APK_FILENAME: ${{ steps.version.outputs.filename }}
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk "dist/$APK_FILENAME"
          test -s "dist/$APK_FILENAME"
          sha256sum "dist/$APK_FILENAME"
      - name: Upload APK as Actions artifact
        uses: actions/upload-artifact@v4
        with:
          name: IRControl-APK
          path: dist/*.apk
          if-no-files-found: error
      - name: Publish one GitHub Release per version
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          APK_FILENAME: ${{ steps.version.outputs.filename }}
        run: |
          # Do not silently overwrite a release from an older source revision.
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::notice::Release $TAG exists. Bump versionName and versionCode in app/build.gradle for the next release."
            exit 0
          fi
          gh release create "$TAG" "dist/$APK_FILENAME" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "IR Control Testing $TAG (Android API 37)" \
            --generate-notes
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json tagName,assets,url
