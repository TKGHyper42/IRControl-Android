name: Publish IR Control APK

on:
  push:
    paths:
      - '.github/workflows/publish-apk.yml'
  workflow_dispatch:

permissions:
  actions: read
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - name: Retrieve verified compiled APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p .tmp-apk
          gh run download 42109564452 --repo "$GITHUB_REPOSITORY" --name IRControl-APK --dir .tmp-apk
          test -s .tmp-apk/app-debug.apk
      - name: Publish APK in releases directory
        run: |
          mkdir -p releases
          cp .tmp-apk/app-debug.apk releases/IRControl-Android-v1.1-API37.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add releases/IRControl-Android-v1.1-API37.apk
          if ! git diff --cached --quiet; then
            git commit -m "Add compiled IR Control v1.1 APK [skip ci]"
            git push origin HEAD:main
          fi
